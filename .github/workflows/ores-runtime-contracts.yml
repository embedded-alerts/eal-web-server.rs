name: ORES runtime contracts
on:
  pull_request:
    paths: ['.zpkg.toml', '.zpkg.lock', '.cli-flags.toml', '.ores-*.toml', '.shared-auth.toml', '.auth-shared.toml', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ores-runtime-contracts.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ores-runtime-contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  ZED_CLI_REV: a1c5b7a3c72b957944b76911fcbc723dd9c16541
  FLAGS2ENV_REV: 333c2ace93c362d274171ab0e0edf613d96a8e59
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { ref: '${{ env.EXPECTED_HEAD }}', persist-credentials: false }
      - name: Build pinned tools and execute authored contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"; test -f .zpkg.toml; test -f .cli-flags.toml
          git clone --filter=blob:none https://github.com/zed-pkg/zed-cli.git "$RUNNER_TEMP/zed-cli"; git -C "$RUNNER_TEMP/zed-cli" checkout --detach "$ZED_CLI_REV"; (cd "$RUNNER_TEMP/zed-cli" && cargo build --locked --release --bin zed)
          git clone --filter=blob:none https://github.com/flags-2-env/flags-2-env.git "$RUNNER_TEMP/flags2env"; git -C "$RUNNER_TEMP/flags2env" checkout --detach "$FLAGS2ENV_REV"; make -C "$RUNNER_TEMP/flags2env" all
          ZED_BIN="$RUNNER_TEMP/zed-cli/target/release/zed"
          consumer="$RUNNER_TEMP/oresc-zed-consumer"
          mkdir -p "$consumer"
          (cd "$consumer" && "$ZED_BIN" install oresoftware/ores-cli@=0.1.0 --do-not-write-new-manifest --allow-build --adapter none)
          (cd "$consumer" && "$ZED_BIN" run oresc -- --no-json doctor)
          (cd "$consumer" && "$ZED_BIN" run ores-cli -- --no-json doctor)
          "$ZED_BIN" validate --manifest .zpkg.toml
          "$RUNNER_TEMP/flags2env/build/flags2env" audit .cli-flags.toml
          (cd "$consumer" && "$ZED_BIN" run oresc -- --no-json audit repo --path "$GITHUB_WORKSPACE" --profile baseline)
          (cd "$consumer" && "$ZED_BIN" run ores-cli -- --no-json audit repo --path "$GITHUB_WORKSPACE" --profile baseline)
          (cd "$consumer" && "$ZED_BIN" run oresc -- --no-json audit repo --path "$GITHUB_WORKSPACE" --profile source)
          ! (test -f .shared-auth.toml && test -f .auth-shared.toml)
          ! grep -R --line-number --fixed-strings 'github.com/ORESoftware/flags-2-env' Cargo.toml Cargo.lock .zpkg.toml 2>/dev/null
          git diff --exit-code HEAD
