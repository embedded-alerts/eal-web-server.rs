name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Zed CLI
        run: cargo install --git https://github.com/zed-pkg/zed-cli --rev 822bbdef7ebb9218a83ad7d3b3dca78ade1add79 --locked zed-cli
      - name: Materialize browser worker package
        run: zed install --allow-build --install-mode copy
      - name: Verify ores-sw payload
        run: |
          test -f .vendor/.zed/oresoftware/ores-sw/dist/service-worker.js
          test -f .vendor/.zed/oresoftware/ores-sw/rust/axum08.rs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
